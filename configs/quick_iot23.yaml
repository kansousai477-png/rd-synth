project:
  seed: 42
  device: auto
  out_dir: outputs/debug/quick_iot23
  num_threads: 4

data:
  dataset: cic_iot2023
  task: binary
  csv_glob: "**/*.csv"
  merge_strategy: intersection
  drop_cols: [Flow ID, Src IP, Dst IP, Timestamp]
  drop_zero_variance: true
  drop_near_constant: true
  test_frac: 0.15
  val_frac: 0.15
  max_rows: 5000
  preprocess:
    winsorize_quantile: 0.01
    impute: median
    type_aware: true
    power_transform: true
    scaler: robust
    discrete_scaling: minmax

oracle_models:
  - name: mlp_small
    type: mlp
    hidden_dims: [128, 128]
    epochs: 3
    batch_size: 256
    lr: 1.0e-3
    max_batches_per_epoch: 20
    class_weight: balanced
    sample_strategy: balanced

stage1:
  z_dim: 32
  gen_hidden: [128, 128]
  sur_hidden: [128, 128]
  steps: 200
  batch_size: 128
  lr_s: 1.0e-3
  lr_g: 1.0e-3
  log_every: 100
  query_strategy: entropy
  query_pool: 4
  query_mix_ratio: 0.5
  query_real_ratio: 1.0
  query_balance: true
  real_warmup_steps: 50
  calibration_bins: 10
  use_forward_diff: true
  n_G: 1
  n_S: 1
  fd_m: 3
  fd_epsilon: 0.01
  consistency_weight: 0.1
  force_retrain: true
  balance_eval: true
  eval_max_rows: 1000
  eval_batch_size: 256
  compute_matrix: false
  compare_baseline: false
  oracle_names: [mlp_small]

stage2:
  mode: latent_diffusion
  epochs: 5
  batch_size: 128
  lr: 1.0e-4
  ae_epochs: 3
  ae_lr: 1.0e-3
  latent_dim: 32
  ae_hidden: [128, 64]
  timesteps: 50
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  schedule_type: cosine
  cond_dropout: 0.1
  guidance_scale: 1.5
  denoiser_hidden: 128
  editor_hidden: [128, 64]
  lambda_recon: 5.0
  lambda_delta: 1.0
  lambda_stp: 1.0
  lambda_mmt: 0.5
  lambda_corr: 0.1
  lambda_var: 0.05
  lambda_ben: 0.3
  lambda_protocol: 0.03
  lambda_temporal: 0.03
  lambda_preserve: 0.05
  oracle_name: mlp_small
  require_stage1: true
  eval_metrics: true
  eval_samples: 500
  metrics_max_real: 500
  metrics_max_gen: 500
  sample_batch_size: 128
  sample_init: benign_sample
  constraints:
    enable: true
    clip: true
    round_integer: true
  baselines:
    enable: true
    methods: [identity, global_random, fgsm, pgd]
    fgsm_eps: 0.10
    pgd_eps: 0.20
    pgd_alpha: 0.05
    pgd_steps: 10
    apply_constraints: true
  save_samples: true
  pareto_eval:
    enable: true
    auto_select: true
    anchor_grid: [0.0, 0.1, 0.3]
    max_samples: 300
    selection:
      prefer_oracle: true
      min_asr_oracle: 0.80

stage3:
  adv_samples_path: ""
  copy_adv_samples: true
  feature_backend: nfstream
  pcap_path: ""
  pcap_scan_dir: data/PCAPs/malicious
  pcap_scan_limit: 6
  pcap_scan_min_prob: 0.5
  pcap_scan_glob: "*.pcap"
  pcap_source_selection_mode: random_hard
  pcap_source_sample_n: 1
  pcap_out_dir: outputs/debug/quick_iot23/stage3/pcap
  pcap_apply_n: 1
  pcap_apply_fields: [mean_iat_ms, std_iat_ms, pad_bytes, dst_port_new, flag_ratio, flow_scale]
  pcap_search_alphas: [0.25, 0.5, 1.0]
  pcap_search_rounds: 1
  pcap_search_probe_topk: 6
  pcap_tcp_fixup: true
  pcap_eval: true
  pcap_eval_use_ids: false
  pcap_eval_use_oracle: true
  pcap_compare_baselines: false
  remap_train_source: all
  remap_mode: learned
  remap_min_r2: 0.0
  loss: huber
  huber_beta: 1.0
  epochs: 10
  batch_size: 128
  lr: 5.0e-4


