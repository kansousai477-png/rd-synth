project:
  seed: 42
  device: auto
  out_dir: outputs/reviewer_suite/2017/attack_sweep/default
  num_threads: 4
  num_interop_threads: 2

data:
  dataset: cic_ids2017
  task: binary
  merge_strategy: intersection
  include_labels: [BENIGN, DDoS]
  benign_labels: [BENIGN, Benign]
  log1p_cols: []
  drop_zero_variance: true
  drop_near_constant: true
  near_constant_var: 1.0e-12
  test_frac: 0.15
  val_frac: 0.15
  max_rows_per_label: 12000
  preprocess:
    winsorize_quantile: 0.01
    impute: median
    type_aware: true
    power_transform: true
    scaler: robust
    discrete_scaling: minmax

oracle_models:
  - name: mlp_small
    type: mlp
    hidden_dims: [128, 128]
    epochs: 5
    batch_size: 512
    lr: 1.0e-3
    max_batches_per_epoch: 40
    class_weight: balanced
    sample_strategy: balanced

stage1:
  z_dim: 32
  gen_hidden: [256, 256]
  sur_hidden: [256, 256]
  steps: 500
  batch_size: 256
  lr_s: 1.0e-3
  lr_g: 1.0e-3
  log_every: 100
  query_strategy: entropy
  query_pool: 4
  query_mix_ratio: 0.5
  query_real_ratio: 1.0
  query_balance: true
  real_warmup_steps: 100
  calibration_bins: 10
  query_budget: null
  use_forward_diff: true
  n_G: 1
  n_S: 1
  fd_m: 3
  fd_epsilon: 0.01
  consistency_weight: 0.1
  consistency_noise: 0.05
  balance_eval: true
  force_retrain: true
  eval_max_rows: 3000
  eval_batch_size: 1024
  compute_matrix: false
  matrix_max_rows: 2000
  matrix_batch_size: 1024
  compare_baseline: true
  baseline_steps: 200
  oracle_names: [mlp_small]
  data_quality:
    enable: true
    max_rows: 30000
    high_missing_threshold: 0.1
    corr_topk: 5

stage2:
  mode: latent_diffusion
  epochs: 18
  batch_size: 256
  lr: 1.0e-4
  ae_epochs: 12
  ae_lr: 1.0e-3
  latent_dim: 48
  ae_hidden: [256, 128]
  timesteps: 150
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  schedule_type: cosine
  cond_dropout: 0.1
  cond_dropout_start: 0.3
  cond_dropout_end: 0.1
  cond_dropout_warmup_epochs: 6
  guidance_scale: 1.8
  denoiser_hidden: 256
  denoiser_dropout: 0.05
  predict_x0: false
  x0_head_tanh: false
  cond_norm: true
  emb_norm: true
  eps_pred_clip: 3.0
  latent_std_floor: 0.05
  editor_hidden: [256, 128]
  lambda_recon: 5.0
  lambda_delta: 1.0
  lambda_stp: 1.0
  lambda_mmt: 0.5
  lambda_corr: 0.1
  lambda_var: 0.05
  lambda_range: 0.1
  lambda_mmd: 0.02
  lambda_swd: 0.02
  lambda_latent: 0.01
  latent_warmup_epochs: 8
  grad_clip: 1.0
  lambda_sem: 0.05
  lambda_ben: 0.3
  lambda_protocol: 0.03
  lambda_temporal: 0.03
  lambda_preserve: 0.0
  ben_temp: 6.0
  ben_loss_clip: 20.0
  var_std_floor: 0.01
  mmd_max: 256
  swd_proj: 64
  oracle_name: mlp_small
  require_stage1: true
  eval_metrics: true
  eval_denorm_metrics: false
  eval_samples: 1000
  metrics_max_real: 1000
  metrics_max_gen: 1000
  sample_batch_size: 512
  sample_init: benign_sample
  latent_use_prior: false
  latent_noise_scale: 1.0
  sample_clip_minmax: true
  sample_denorm_output: false
  sample_pullback_alpha: 0.0
  sample_pullback_k: 5
  sample_moment_alpha: 0.0
  sample_moment_std_floor: 1.0e-3
  residual_scale: 0.2
  mal_anchor_alpha: 0.0
  post_clip_norm_range: true
  deployable_constraints:
    enable: true
    port_policy: clip
    port_allowlist: []
    flag_policy: clip
    temporal_policy: clip_benign
  constraints:
    enable: true
    clip: true
    round_integer: true
    integer_tol: 0.05
    integer_frac: 0.95
    nonneg_tol: 1.0e-8
  baselines:
    enable: true
    methods: [identity, knn_benign, global_random, benign_neighbor_random, fgsm, pgd,
             idsgan_lite, digfupas_lite, gpmt_lite, progen_lite, amoeba_lite, vulnergan_lite, netdiffusion_lite]
    fgsm_eps: 0.15
    pgd_eps: 0.35
    pgd_alpha: 0.04
    pgd_steps: 12
    knn_k: 1
    neighbor_random_k: 5
    apply_constraints: true
    stabilize_inputs: true
    stabilize_quantile: 0.01
    hard_label_queries: true
    query_budget: 20000
    hard_label_threshold: 0.5
    exhausted_fill: 1.0
  save_samples: true
  pareto_eval:
    enable: true
    auto_select: true
    anchor_grid: [0.0, 0.05, 0.1, 0.2, 0.3]
    max_samples: 1000
    selection:
      prefer_oracle: true
      prefer_decision_score: false
      asr_weight: 1.0
      c2st_auc_weight: 0.35
      adv_to_ben_l2_weight: 0.10
      ffd_weight: 0.02
      adv_pmal_weight: 0.25
      min_asr_oracle: 0.95
      max_ffd: 50.0
      max_adv_to_mal_l2: 40.0
      selection_decision_weight: 0.30
      selection_remapability_weight: 0.25
      selection_stage3_loop_weight: 0.30
      selection_support_weight: 0.15
      closed_loop_decision_weight: 0.25
      closed_loop_stage3_weight: 0.50
      closed_loop_support_weight: 0.25

stage3:
  adv_samples_path: ""
  copy_adv_samples: true
  feature_backend: auto
  feature_aliases_path: ""
  pcap_path: data/PCAPs/malicious/rat_backdoor_c2/20260120_rat_backdoor_c2_xworm.pcap
  pcap_scan_dir: data/PCAPs/malicious
  pcap_semantic_filter: true
  pcap_dataset: cic_ids2017
  pcap_attack_label: DDoS
  pcap_scan_limit: 32
  pcap_apply_fields: [mean_iat_ms, std_iat_ms, pad_bytes, dst_port_new, flag_ratio, flow_scale, payload_scale, src_port_new, tcp_init_win_fwd, tcp_init_win_bwd, syn_flag_ratio, fin_flag_ratio, rst_flag_ratio, fwd_pkt_scale, bwd_pkt_scale, fwd_payload_scale, bwd_payload_scale, fwd_iat_mean_ms, fwd_iat_std_ms, bwd_iat_mean_ms, bwd_iat_std_ms]
  pcap_search_alphas: [0.3, 0.5, 0.75, 1.0, 1.5]
  pcap_search_rounds: 2
  pcap_search_bidirectional: true
  pcap_search_field_subsets: true
  pcap_search_probe_topk: 8
  pcap_eval: true
  pcap_eval_use_ids: true
  pcap_eval_use_oracle: true
  pcap_eval_dual: true
  pcap_compare_baselines: false
  oracle_name: mlp_small
  remap_train_source: benign
  remap_mode: learned
  remap_min_r2: 0.0
  remap_min_decision_score: 0.55
  loss: huber
  huber_beta: 1.0
  grad_clip: 1.0
  target_clip_sigma: 5.0
  weight_decay: 1.0e-4
  epochs: 30
  batch_size: 256
  lr: 1.0e-4


